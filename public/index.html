<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog Feed — Rana Yasir Mahy Ud Din</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between font-sans">

  <!-- Header -->
  <header class="border-b border-slate-800 bg-slate-900/60 backdrop-blur sticky top-0 z-50">
    <div class="max-w-5xl mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-xl shadow-lg">BF</div>
        <span class="text-lg font-bold tracking-wider">DevPulse Blog</span>
      </div>
      <div class="flex items-center space-x-4">
        <a href="/index.html" class="text-xs font-semibold text-indigo-400">Home Feed</a>
        <a href="/admin.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs px-3 py-1.5 rounded-xl font-medium transition-all">CMS Admin</a>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-5xl mx-auto px-6 py-10 flex-grow w-full">
    <div class="text-center mb-10">
      <h1 class="text-3xl font-extrabold tracking-tight mb-2">Engineering Insights & Articles</h1>
      <p class="text-slate-400 text-sm max-w-lg mx-auto">Explore full-stack tutorials, architecture patterns, and UI/UX design notes.</p>
    </div>

    <!-- Posts Container -->
    <div id="posts-container" class="space-y-6">
      <!-- Populated dynamically -->
    </div>
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-800 bg-slate-900/40 py-6 text-center text-xs text-slate-500">
    © 2026 Rana Yasir Mahy Ud Din • RESTful Blogging Platform & CMS API
  </footer>

  <script>
    async function fetchPosts() {
      try {
        const res = await fetch('/api/posts');
        const json = await res.json();
        if (json.success) {
          renderPosts(json.data);
        }
      } catch (err) {
        console.error('Error fetching posts:', err);
      }
    }

    function renderPosts(posts) {
      const container = document.getElementById('posts-container');
      if (posts.length === 0) {
        container.innerHTML = `<p class="text-xs text-slate-500 text-center py-10">No articles published yet.</p>`;
        return;
      }

      container.innerHTML = posts.map(p => `
        <article class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
          <div class="flex justify-between items-center text-xs">
            <span class="bg-indigo-500/10 text-indigo-400 font-semibold px-3 py-1 rounded-full">${p.category}</span>
            <span class="text-slate-500">${p.publishedAt} • By ${p.author}</span>
          </div>
          <h2 class="text-xl font-bold text-slate-100">${p.title}</h2>
          <p class="text-slate-300 text-sm leading-relaxed">${p.content}</p>
          
          <div class="pt-4 border-t border-slate-800">
            <h4 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3">Comments (${p.comments.length})</h4>
            <div class="space-y-2 mb-4">
              ${p.comments.length === 0 ? `<p class="text-xs text-slate-500">No comments yet. Be the first!</p>` : 
                p.comments.map(c => `
                  <div class="p-3 bg-slate-950/60 rounded-xl border border-slate-800 text-xs">
                    <span class="font-bold text-indigo-300">${c.name}</span> <span class="text-slate-500 text-[10px]">(${c.date})</span>
                    <p class="text-slate-300 mt-1">${c.text}</p>
                  </div>
                `).join('')
              }
            </div>
            <form onsubmit="addComment(event, ${p.id})" class="flex gap-2">
              <input type="text" id="comment-name-${p.id}" required placeholder="Your Name" class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs w-1/3 focus:outline-none focus:border-indigo-500">
              <input type="text" id="comment-text-${p.id}" required placeholder="Write a comment..." class="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs flex-grow focus:outline-none focus:border-indigo-500">
              <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-4 py-2 rounded-xl text-xs transition-all">Post</button>
            </form>
          </div>
        </article>
      `).join('');
    }

    async function addComment(e, postId) {
      e.preventDefault();
      const name = document.getElementById(`comment-name-${postId}`).value;
      const text = document.getElementById(`comment-text-${postId}`).value;

      try {
        const res = await fetch(`/api/posts/${postId}/comments`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, text })
        });
        const json = await res.json();
        if (json.success) {
          fetchPosts();
        } else {
          alert(json.message);
        }
      } catch (err) {
        alert('Failed to post comment.');
      }
    }

    fetchPosts();
  </script>
</body>
</html>
